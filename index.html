<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1014" />
    <!-- Inline so there is no favicon request to 404 on. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f4e9e1'/%3E%3C/svg%3E"
    />
    <title>Pooklet</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f4e9e1;
        --dim: #b09a90;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1a1014;
        color: var(--ink);
        font-family: ui-serif, Georgia, 'Times New Roman', serif;
        overscroll-behavior: none;
      }
      #world {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #shell {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem;
        text-align: center;
      }
      #shell[hidden] {
        display: none;
      }
      .card {
        max-width: 32rem;
      }
      h1 {
        font-weight: 400;
        font-size: clamp(1.75rem, 6vw, 2.75rem);
        margin: 0 0 0.5rem;
        letter-spacing: 0.01em;
      }
      p {
        color: var(--dim);
        line-height: 1.6;
        margin: 0 0 1.5rem;
      }
      button {
        font: inherit;
        font-size: 1rem;
        color: #1a1014;
        background: var(--ink);
        border: 0;
        border-radius: 999px;
        padding: 0.75rem 2rem;
        cursor: pointer;
        min-height: 44px;
      }
      button:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 3px;
      }
      #status {
        position: fixed;
        left: 50%;
        bottom: max(1rem, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        color: var(--dim);
        font-size: 0.8125rem;
        letter-spacing: 0.02em;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="world"></canvas>

    <div id="shell">
      <div class="card">
        <h1>Pooklet</h1>
        <p>
          A place made by one person and walked by two. Turn your sound on — you will be able to
          hear each other.
        </p>
        <button id="enter" type="button">Step inside</button>
      </div>
    </div>

    <div id="status" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
